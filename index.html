<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mes Archives Musicales</title>
  
  <!-- Lien vers le manifest PWA (pour le plein écran sans barre d'adresse) -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff">

  <!-- Polices Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Righteous&display=swap" rel="stylesheet">

  <!-- Feuille de style -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ENCART 1 : HEADER TITRE FIXE -->
  <header>
    <button id="back-btn" class="back-btn hidden">&larr;</button>
    <div class="header-title-container">
      <span id="header-subtitle" class="header-subtitle">MES ARCHIVES MUSICALES</span>
      <h1 id="header-title" class="title-90s">MINIDISCS</h1>
    </div>
  </header>

  <!-- ENCART 2 : SÉLECTION DU MOMENT FIXE & SOMBRE -->
  <div id="featured-container" class="featured-container">
    <div class="featured-header">
      <span class="featured-title">SÉLECTION DU MOMENT</span>
      <button id="refresh-featured-btn" class="refresh-btn" title="Changer la sélection">
        &#8635;
      </button>
    </div>
    <div id="featured-grid" class="featured-grid">
      <!-- Généré dynamiquement via app.js -->
    </div>
  </div>

  <!-- CONTENU PRINCIPAL (LISTE / DÉTAILS) -->
  <main id="app">
    <!-- Contenu injecté par app.js -->
  </main>

  <!-- Script JS principal -->
  <script src="app.js"></script>
</body>
</html>
