<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiniDisc Collection Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- EN-TÊTE PRINCIPAL -->
  <header class="app-header">
    <div class="header-content">
      <h1>💽 MiniDisc Collection</h1>
      <button class="btn-primary" onclick="openAdminModal()">＋ Ajouter un MiniDisc</button>
    </div>
  </header>

  <!-- CONTENU PRINCIPAL / LISTE DES MINIDISCS -->
  <main class="app-main">
    <!-- FILTRES DE GENRE -->
    <section class="filters-section">
      <div id="genre-badges" class="genre-badges">
        <!-- Généré dynamiquement en JS -->
      </div>
    </section>

    <!-- GRILLE / LISTE DE CARTES -->
    <section id="minidisc-grid" class="minidisc-grid">
      <!-- Les cartes MiniDisc seront injectées ici par app.js -->
    </section>
  </main>

  <!-- LISTE DE SUGGESTIONS POUR LES GENRES -->
  <datalist id="genres-list">
    <option value="Hip-Hop"></option>
    <option value="Rap"></option>
    <option value="Rock"></option>
    <option value="Electronic"></option>
    <option value="Pop"></option>
    <option value="Jazz"></option>
    <option value="Reggae"></option>
    <option value="Funk / Soul"></option>
    <option value="Metal"></option>
  </datalist>

  <!-- MODALE FORMULAIRE ADMIN (AJOUT ET ÉDITION) -->
  <div id="admin-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="admin-modal-title" style="margin: 0; font-size: 1.1rem; color: var(--text-main, #333);">＋ Ajouter un MiniDisc</h3>
        <button class="close-btn" type="button" onclick="closeAdminModal()">&times;</button>
      </div>

      <form id="admin-form">
        <!-- CHAMPS GLOBAUX DU MINIDISC -->
        <div class="form-group">
          <label for="md-title">Titre global du MiniDisc / Compilation</label>
          <input type="text" id="md-title" placeholder="ex: Sad Hill / Compilation Maison" required>
        </div>

        <div class="form-group">
          <label for="md-status">Statut d'enregistrement</label>
          <div class="checkbox-group" style="margin-top: 5px;">
            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-weight: bold; font-size: 0.85rem;">
              <input type="checkbox" id="md-to-record" style="width: 16px; height: 16px;">
              🎙️ À enregistrer
            </label>
          </div>
        </div>

        <hr style="border: none; border-top: 1px dashed var(--border-color, #ccc); margin: 15px 0;">

        <!-- CONTENEUR DYNAMIQUE DES ALBUMS -->
        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <label style="font-weight: bold; margin: 0;">Albums sur ce MiniDisc</label>
            <button type="button" class="btn-sub" onclick="addAdminAlbumBlock()">+ Ajouter un album</button>
          </div>

          <div id="albums-container" style="display: flex; flex-direction: column; gap: 15px;">
            <!-- Les blocs d'albums dynamiques seront insérés ici via JavaScript -->
          </div>
        </div>

        <!-- BOUTONS D'ACTION DU FORMULAIRE -->
        <div class="form-actions" style="display: flex; gap: 8px; margin-top: 20px;">
          <button type="submit" class="btn-primary" style="flex: 1; margin-bottom: 0;">Enregistrer</button>
          <button type="button" class="btn-secondary" onclick="closeAdminModal()">Annuler</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
